services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestor:
    build: ./services/ingestor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      INGEST_BACKFILL_YEARS: ${INGEST_BACKFILL_YEARS}
      INGEST_CURRENT_INTERVAL_MIN: ${INGEST_CURRENT_INTERVAL_MIN}
      INGEST_FORECAST_INTERVAL_HOURS: ${INGEST_FORECAST_INTERVAL_HOURS}
    # OpenWeather serves api.openweathermap.org via round-robin DNS across
    # several clouds (OVH France, Hetzner Germany, ...). On some networks
    # a subset of those IPs is unreachable, and a fresh DNS lookup may roll
    # the unlucky one. Pinning to the EU subdomain's IP gives a stable
    # working route from most networks (override in your local environment
    # if 176.9.63.49 ever stops working — `nslookup api.openweathermap.org`
    # to find a current alternative).
    extra_hosts:
      - "api.openweathermap.org:176.9.63.49"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      # PUBLIC_API_URL is shown to the user as a clickable link.
      # Default localhost is correct for local docker compose; override
      # in .env (e.g. "https://api.weather.example.com") for production.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
